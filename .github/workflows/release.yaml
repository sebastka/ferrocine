name: Release

# Pushes to master publish `edge`. Running this workflow by hand on master
# publishes a dated release: the image tags `YYYY-MM-DD` (`YYYY-MM-DD.1`, `.2`…
# for further releases the same day, UTC) and `latest`, a Git tag and a
# GitHub release.
# Every image is signed with cosign (keyless, by this workflow's identity)
# and gets a signed build provenance attestation.
'on':
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: Publish a dated release (YYYY-MM-DD) of this commit
        default: true

permissions:
  contents: read

# Serialized, so that two releases never compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        with:
          script: |-
            if (process.env.RELEASE !== 'true') {
              core.setOutput('release', 'false');
              core.setOutput('version', `edge-${context.sha.slice(0, 7)}`);
              return;
            }
            if (context.ref !== 'refs/heads/master') {
              core.setFailed(`releases are made from master, not ${context.ref}`);
              return;
            }
            const { data: releases } = await github.rest.repos.listReleases({ ...context.repo, per_page: 1 });
            const today = new Date().toISOString().slice(0, 10);
            const [day, n] = (releases[0]?.tag_name ?? '').split('.');
            const tag = day === today ? `${today}.${Number(n ?? 0) + 1}` : today;
            core.setOutput('release', 'true');
            core.setOutput('version', tag);
            await core.summary.addHeading(`Release ${tag}`).write();

  build:
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ needs.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }},priority=1000
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
            type=edge,branch=master
            type=sha
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tag options and the digests are meant to split into words.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ json . }}' | jq -r '.manifest.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION is $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  sign:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signing the index digest covers every platform's image and the SBOM
      # and provenance attestations it lists.
      - name: Sign with cosign
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yaml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify --repo "$REPO" "oci://$IMAGE@$DIGEST"

  release:
    needs: [version, merge, sign]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          ## Image

          \`$IMAGE:$TAG\` (\`$IMAGE@$DIGEST\`), for linux/amd64 and linux/arm64.

          Signed with cosign and attested by this repository's release workflow:

          \`\`\`sh
          cosign verify $IMAGE:$TAG \\
            --certificate-identity https://github.com/$REPO/.github/workflows/release.yaml@refs/heads/master \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify --repo $REPO oci://$IMAGE:$TAG
          \`\`\`
          EOF
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes.md --generate-notes
