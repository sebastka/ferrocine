[package]
name = "ferrocine"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Self-hosted media server: read-only libraries, metadata in SQL, hardware transcoding, OpenID Connect sign-in"
license = "MIT"
repository = "https://github.com/sebastka/ferrocine"
readme = "README.md"
publish = false

[lib]
# No doctests; the DHI build image ships without rustdoc.
doctest = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "form"] }
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always", "tzdb-zoneinfo"] }
prometheus-client = "0.25.1"
quick-xml = "0.42.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
unicode-normalization = "0.1.26"

reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "http2", "charset", "query", "stream"] }
ring = "0.17.14"
rustix = { version = "1.1.5", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "any", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs", "process"] }
tokio-util = { version = "0.7.20", features = ["rt", "io"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }

[profile.release]
# Speed over size: scans hash, parse and resize images; ffmpeg does the heavy lifting.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
